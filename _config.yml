# GitHub Pages Configuration
title: "Start Your Quant"
description: "Academia de Trading Cuantitativo - De cero a quant trader profesional"
baseurl: "/start-your-quant"
url: "https://jefrnc.github.io"

# Theme
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-remote-theme

# Navigation
show_downloads: false

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Collections
collections:
  fundamentos:
    output: true
    permalink: /:collection/:name/
  estrategias:
    output: true
    permalink: /:collection/:name/
  analisis:
    output: true
    permalink: /:collection/:name/

# SEO
google_analytics: # Tu código de Google Analytics aquí
twitter:
  username: # Tu usuario de Twitter

# Social links
github_username: jefrnc
linkedin_username: jefrnc

# Exclude files
exclude:
  - .gitignore
  - requirements.txt
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/